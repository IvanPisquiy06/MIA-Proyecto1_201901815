<main class="main">
  <div class="header">
    <h1>C++ Proyecto 1 - Consola en web</h1>
  </div>

  <div class="output-area" #scrollMe>
    <pre>{{ output() }}</pre>
  </div>

  <div class="input-area">
    <span class="cmd-symb">></span>
    <input
    type="text"
    [(ngModel)]="input"
    (keyup.enter)="executeCommand()"
    placeholder="Esperando comando..."
    autofocus
    />
    <button (click)="executeCommand()">Ejecutar</button>
  </div>
</main>
